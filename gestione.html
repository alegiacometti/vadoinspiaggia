<!DOCTYPE html>
<html lang="it">
<head>

<style>
/* Questa pagina NON e' protetta dal fatto di essere nascosta: chiunque puo'
   aprirla, e va benissimo. A proteggere sono le regole del database — senza
   una sessione da amministratore ogni richiesta torna vuota. La schermata
   "non hai accesso" qui sotto e' cortesia verso chi capita per sbaglio, non
   una serratura: una serratura fatta di JavaScript non e' una serratura. */
.gest-cifre{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 22px}
.gest-cifra{flex:1 1 150px;background:var(--carta);border:1px solid var(--tratto);
  border-radius:10px;padding:13px 16px;box-shadow:var(--ombra)}
.gest-cifra b{display:block;font-family:var(--display);font-weight:400;font-size:30px;
  line-height:1;color:var(--profondo)}
.gest-cifra span{font-family:var(--dati);font-size:9.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--grigio)}
.gest-nota{margin:-6px 0 12px;font-size:12.5px;line-height:1.55;color:var(--grigio)}
.gest-nota b{color:var(--profondo);font-weight:500}
.gest-sez{margin:0 0 12px;font-family:var(--dati);font-size:10px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--azzurro)}
.gest-tab{width:100%;border-collapse:collapse;background:var(--carta);
  border:1px solid var(--tratto);border-radius:10px;overflow:hidden;box-shadow:var(--ombra)}
.gest-tab th{font-family:var(--dati);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--grigio);text-align:left;padding:10px 13px;background:var(--nebbia);
  border-bottom:1px solid var(--tratto);font-weight:400;white-space:nowrap}
.gest-tab td{padding:11px 13px;border-bottom:1px solid var(--tratto);font-size:13.5px;
  vertical-align:top;color:var(--profondo)}
.gest-tab tr:last-child td{border-bottom:0}
.gest-tab tr:hover td{background:var(--schiuma)}
.gest-chi{font-weight:500}
.gest-quando{font-family:var(--dati);font-size:10.5px;color:var(--grigio);white-space:nowrap}
.gest-ruolo{font-family:var(--dati);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  border:1px solid var(--tratto);border-radius:999px;padding:2px 8px;color:var(--grigio)}
.gest-ruolo.admin{background:var(--profondo);color:#fff;border-color:var(--profondo)}
.gest-ruoli{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:4px}
button.gest-ruolo{cursor:pointer;background:#fff;font-family:var(--dati);transition:.14s}
button.gest-ruolo:hover{background:var(--schiuma);border-color:var(--azzurro);color:var(--azzurro)}
button.gest-ruolo:focus-visible{outline:2px solid var(--ambra);outline-offset:2px}
.gest-sbl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gest-pat{display:inline-flex;align-items:center;gap:6px;font-size:12px;
  background:var(--schiuma);border:1px solid var(--basso);border-radius:999px;padding:3px 6px 3px 11px}
.gest-pat.paese{background:#eef3ff;border-color:#b9c8ef}
.gest-pat.scaduto{background:#f4f1ec;border-color:var(--tratto);color:var(--grigio);
  text-decoration:line-through}
.gest-x{background:none;border:1px solid var(--tratto);border-radius:999px;width:24px;height:24px;
  line-height:1;cursor:pointer;color:var(--grigio);font-size:11px;padding:0}
.gest-x:hover{color:var(--corallo);border-color:var(--corallo)}
.gest-pat button{background:none;border:0;cursor:pointer;color:var(--grigio);
  font-size:13px;line-height:1;padding:0 3px;border-radius:50%}
.gest-pat button:hover{color:#a3352a;background:#fdecea}
.gest-niente{color:var(--secca);font-size:12.5px}
.gest-piu{font-family:var(--dati);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  background:var(--carta);border:1px dashed var(--basso);border-radius:999px;padding:4px 11px;
  color:var(--azzurro);cursor:pointer}
.gest-piu:hover{background:var(--nebbia);border-style:solid}
.gest-barra{width:100%;height:6px;background:var(--nebbia);border-radius:99px;overflow:hidden}
.gest-barra i{display:block;height:100%;background:var(--azzurro)}
.gest-vuoto{padding:20px;text-align:center;color:var(--grigio);font-size:13px}
.gest-fuori{max-width:520px;margin:60px auto;text-align:center}
.gest-fuori h2{font-family:var(--display);font-weight:400;font-size:26px;color:var(--profondo);margin:0 0 10px}
.gest-fuori p{font-size:13.5px;line-height:1.6;color:#20536e;margin:0 0 18px}
/* Lo stato dei contenuti. Il conto lo fa il database; qui si colora soltanto,
   perche' «147 su 170» letto in fretta non dice se e' tanto o poco, e una
   barretta lunga meta' riga lo dice prima di aver finito di leggere. */
.gest-stato-via{display:flex;flex-wrap:wrap;gap:12px;align-items:center;
  background:var(--carta);border:1px solid var(--tratto);border-radius:12px;
  padding:14px 16px}
.gest-stato-via p{margin:0;font-size:12.5px;line-height:1.55;color:var(--grigio);
  flex:1 1 260px}
.gest-stato-via b{color:var(--profondo);font-weight:500}
.gest-cop{text-align:center;white-space:nowrap;min-width:66px}
.gest-cop b{font-family:var(--dati);font-size:12.5px;font-weight:500;color:var(--profondo)}
.gest-cop span{font-family:var(--dati);font-size:9.5px;color:var(--grigio)}
.gest-cop i{display:block;height:3px;width:46px;margin:4px auto 0;border-radius:2px;
  background:var(--nebbia);overflow:hidden}
.gest-cop i u{display:block;height:100%;text-decoration:none;background:#96a7b0}
.gest-cop.pieno b{color:#2c7a61} .gest-cop.pieno i u{background:#2c7a61}
.gest-cop.quasi b{color:#5f9a55} .gest-cop.quasi i u{background:#5f9a55}
.gest-cop.meta  b{color:#b3800f} .gest-cop.meta  i u{background:#b3800f}
.gest-cop.zero  b{color:#96a7b0}
/* «gest-foto» era gia' preso: e' il riquadro della foto da approvare, in fondo
   alla pagina, e ha un bordo e un display:flex che qui facevano un pasticcio.
   Questa si chiama «gest-vista» — la veduta dall'alto, non la fotografia. */
.gest-vista{line-height:1.3;min-width:150px}
.gest-vista b{display:block;font-family:var(--dati);font-size:11.5px;font-weight:500}
.gest-vista span{display:block;font-size:10px;color:var(--grigio)}
.gest-vista.alta b{color:#2c7a61} .gest-vista.media b{color:#b3800f}
.gest-vista.bassa b{color:#96a7b0}
.gest-paese td{background:var(--nebbia);font-family:var(--dati);font-size:10px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--profondo);padding:7px 13px}
.gest-paese td b{font-family:var(--testo);font-size:12px;letter-spacing:0;
  text-transform:none;color:var(--grigio);font-weight:400;margin-left:10px}
.gest-scorri{overflow-x:auto;border-radius:12px}
.gest-scorri .gest-tab{min-width:820px}
/* ------------------------------------------------------------ le schede
   Sei sezioni in colonna erano diventate una pagina che si scorre per venti
   schermate, e le cose urgenti — una foto in attesa, una segnalazione nuova —
   stavano in fondo. Ora sono schede, e quelle due portano il conto scritto
   sopra: si vede dalla prima riga se c'e' qualcosa da fare, senza aprirle. */
.gest-schede{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 20px;
  border-bottom:1px solid var(--tratto);padding-bottom:0}
.gest-schede button{position:relative;display:inline-flex;align-items:center;gap:7px;
  font-family:var(--dati);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;
  padding:9px 13px;cursor:pointer;color:var(--grigio);white-space:nowrap}
.gest-schede button:hover{color:var(--profondo);background:var(--nebbia)}
.gest-schede button.on{color:var(--profondo);border-bottom-color:var(--azzurro)}
.gest-schede button:focus-visible{outline:2px solid var(--ambra);outline-offset:-2px}
.gest-conta{font-family:var(--dati);font-size:9px;letter-spacing:.02em;
  background:var(--corallo);color:#fff;border-radius:999px;padding:1px 6px;line-height:1.5}
.gest-conta.calma{background:var(--tratto);color:var(--grigio)}
.gest-intro{margin:-8px 0 16px;font-size:12.5px;line-height:1.55;color:var(--grigio);
  max-width:70ch}
.gest-intro b{color:var(--profondo);font-weight:500}

/* le immagini da approvare, in galleria: una foto si giudica guardandola */
.gest-gall{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.gest-scatto{background:var(--carta);border:1px solid var(--tratto);border-radius:11px;
  overflow:hidden;box-shadow:var(--ombra);display:flex;flex-direction:column}
.gest-scatto.attesa{border-left:3px solid var(--ambra)}
.gest-scatto img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;
  background:var(--nebbia)}
.gest-scatto .dove{padding:10px 13px 0;font-size:13.5px;font-weight:500;color:var(--profondo)}
.gest-scatto .chi{padding:2px 13px 0;font-family:var(--dati);font-size:10px;color:var(--grigio)}
.gest-scatto .dice{padding:7px 13px 0;font-size:12.5px;line-height:1.5;color:var(--testo)}
.gest-scatto .mosse{display:flex;gap:6px;padding:11px 13px 12px;margin-top:auto}
.gest-scatto .mosse button{font-family:var(--dati);font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;border:1px solid var(--tratto);background:var(--carta);
  border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--grigio)}
.gest-scatto .mosse button.si:hover{border-color:#3a9b5c;color:#1c6b36;background:#e8f6ec}
.gest-scatto .mosse button.no:hover{border-color:var(--corallo);color:#8d2b22;background:#fdecea}
.gest-scatto .bollo{font-family:var(--dati);font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ambra);padding:9px 13px 0}
.gest-scatto .bollo.viva{color:var(--verde-ok,#2c7a61)}
.gest-hafoto{font-family:var(--dati);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ambra);border:1px solid var(--tratto);border-radius:999px;padding:2px 8px;
  background:none;cursor:pointer;margin-top:6px;display:inline-block}
.gest-hafoto:hover{border-color:var(--ambra)}
/* ---------------------------------------------------------- il registro */
.gest-filtri{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.gest-filtri select,.gest-filtri input{font:inherit;font-size:13px;padding:7px 11px;
  border:1px solid var(--tratto);border-radius:999px;background:var(--carta);
  color:var(--profondo)}
.gest-filtri input{min-width:190px}
.gest-filtri input:focus,.gest-filtri select:focus{outline:2px solid var(--ambra);outline-offset:1px}
.gest-filtri .conto-vai{padding:7px 16px;font-size:11px}
.gest-filtri .quanti{margin-left:auto;font-family:var(--dati);font-size:10px;
  letter-spacing:.08em;color:var(--grigio)}
.gest-stato{font-family:var(--dati);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  border-radius:999px;padding:2px 8px;border:1px solid var(--tratto);color:var(--grigio);
  white-space:nowrap}
.gest-stato.fare{background:#fdf4e3;border-color:#e6cd96;color:#8a6410}
.gest-stato.corso{background:#eaf2fa;border-color:#b9d4e3;color:var(--azzurro)}
.gest-stato.fatta{background:#eaf6f1;border-color:#a8d8c6;color:#2c7a61}
.gest-stato.ferma{background:#f4f1ec;border-color:var(--tratto);color:var(--secca)}
.gest-pallini{display:inline-flex;gap:3px}
.gest-pallini i{width:7px;height:7px;border-radius:50%;background:var(--tratto);display:block}
.gest-pallini i.on{background:#2c7a61}
.gest-due{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gest-riga-sez{margin:14px 0 -2px;font-family:var(--dati);font-size:9px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--azzurro)}
#regModulo textarea{font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--tratto);
  border-radius:8px;background:var(--nebbia);resize:vertical}
#veloReg .foglio-conto{max-width:560px}
.gest-modifica{font-family:var(--dati);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  background:none;border:1px solid var(--tratto);border-radius:999px;padding:4px 10px;
  cursor:pointer;color:var(--azzurro)}
.gest-modifica:hover{border-color:var(--azzurro);background:var(--schiuma)}
@media (max-width:760px){ .gest-nascondi{display:none} .gest-due{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="guscio">

  <header class="testata">
    <div>
      <a class="ritorno casa" href="index.html"><svg class="marchio" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#083c5c"/><circle cx="44" cy="20" r="8" fill="#e8b04b"/><path d="M8 40c5 0 5-5 10-5s5 5 10 5 5-5 10-5 5 5 10 5 5-5 8-5" fill="none" stroke="#9ed4ea" stroke-width="6" stroke-linecap="round"/><path d="M8 51c5 0 5-5 10-5s5 5 10 5 5-5 10-5 5 5 10 5 5-5 8-5" fill="none" stroke="#1786bd" stroke-width="6" stroke-linecap="round"/></svg>Home page</a>
      <h1>Gestione</h1>
    </div>
    <div class="conto" id="conto"></div>
  </header>

  <div id="corpo"></div>

  <p class="piede">Dati: EEA · geoBoundaries · ISTAT · GSHHG · Natural Earth · Open-Meteo — immagini: Esri World Imagery, Google Maps. <a href="crediti.html">Crediti e licenze</a></p>

</div>

<dialog class="velo-conto" id="veloSbl">
  <form method="dialog" class="foglio-conto">
    <button class="chiudi" value="x" aria-label="Chiudi">✕</button>
    <p class="conto-nota" id="sblChi"></p>
    <label class="conto-campo"><span>Che cosa sbloccare</span>
      <select id="sblCosa"></select></label>
    <label class="conto-campo"><span>Scadenza (vuoto = per sempre)</span>
      <input type="date" id="sblScade"></label>
    <label class="conto-campo"><span>Nota (facoltativa)</span>
      <input type="text" id="sblNota" placeholder="fiera di Rimini, prova 30 giorni…"></label>
    <p class="conto-esito" id="sblEsito" hidden></p>
    <button type="button" class="conto-vai" id="sblVai">Sblocca</button>

</dialog>

<dialog class="velo-conto" id="veloReg">
  <form method="dialog" class="foglio-conto" id="regModulo">
    <button class="chiudi" value="x" aria-label="Chiudi">✕</button>
    <p class="conto-nota" id="regChi"></p>
    <div class="gest-due">
      <label class="conto-campo"><span>Stato</span>
        <select id="regStato">
          <option value="">non segnato</option>
          <option value="da fare">da fare</option>
          <option value="in corso">in corso</option>
          <option value="fatta">fatta</option>
          <option value="ferma">ferma</option>
        </select></label>
      <label class="conto-campo"><span>Priorità 1-5</span>
        <input type="number" id="regPrio" min="1" max="5" step="1"></label>
    </div>
    <label class="conto-campo"><span>Note (le vedi solo tu)</span>
      <textarea id="regNote" rows="2" placeholder="ricontrollare la posizione, chiedere foto al bagnino…"></textarea></label>
    <div class="gest-due">
      <label class="conto-campo"><span>Sponsor locale</span>
        <input type="text" id="regSpon" placeholder="Bagni Nella 57"></label>
      <label class="conto-campo"><span>Pagato fino al</span>
        <input type="date" id="regFino"></label>
    </div>
    <p class="gest-riga-sez">Nella scheda, per chi guarda</p>
    <label class="conto-campo"><span>Comune per le notizie</span>
      <input type="text" id="regCom" placeholder="Senigallia"></label>
    <label class="conto-campo"><span>Dove mangiare · collegamento</span>
      <input type="url" id="regRist" placeholder="https://www.thefork.it/ristoranti/…"></label>
    <label class="conto-campo"><span>Dove dormire · collegamento</span>
      <input type="url" id="regAlb" placeholder="https://www.booking.com/…"></label>
    <label class="conto-campo"><span>Ombrellone · collegamento</span>
      <input type="url" id="regOmb" placeholder="https://www.spiagge.it/…"></label>
    <label class="conto-campo"><span>Cosa fare · collegamento</span>
      <input type="url" id="regAtt" placeholder="https://www.getyourguide.it/…"></label>
    <p class="conto-esito" id="regEsito" hidden></p>
    <button type="button" class="conto-vai" id="regVai">Salva</button>
  </form>
</dialog>

<script>
/* =========================================================================
   La dashboard non decide niente: chiede, e il database risponde secondo le
   sue regole. Se chi guarda non e' amministratore, le richieste tornano vuote
   ed e' quello — non un controllo scritto qui — a tenere fuori gli estranei.
   ========================================================================= */
const corpo = document.getElementById("corpo");
const veloSbl = document.getElementById("veloSbl");
let REGIONI = [], PACCHETTI = [], PROFILI = [], ACCESSI = [], PARERI = [], IO = null;

const esc = t => String(t == null ? "" : t)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const giorno = d => d ? new Date(d).toLocaleDateString("it-IT",
  {day:"2-digit", month:"2-digit", year:"numeric"}) : "—";
const scaduto = a => a.scade_il && new Date(a.scade_il) < new Date();

function fuori(titolo, testo, conPulsante){
  corpo.innerHTML =
    '<div class="gest-fuori"><h2>'+esc(titolo)+'</h2><p>'+esc(testo)+'</p>'+
    (conPulsante ? '<button type="button" class="conto-vai" id="fEntra">Accedi</button>' : '')+
    '</div>';
  const b = document.getElementById("fEntra");
  if (b) b.onclick = () => window.apriConto && window.apriConto("accedi");
}

let SEGN = [], FOTOLIB = [];
let IMPOST = null;
let IMP_DETTO = "";      /* il messaggio sopravvive al ridisegno che segue */
async function carica(){
  if (!VADO.chiSono())
    return fuori("Questa pagina è riservata",
      "Serve un account con i permessi di amministrazione. Se ne hai uno, accedi.", true);
  corpo.innerHTML = '<div class="gest-vuoto">Un momento…</div>';
  try{
    [REGIONI, PACCHETTI, PROFILI, ACCESSI] = await Promise.all([
      VADO.chiedi("regioni?select=chiave,nome,paese,spiagge,libera&order=ordine"),
      VADO.chiedi("pacchetti?select=chiave,nome,paese"),
      VADO.chiedi("profili?select=utente,nome,email,ruolo,creato,ultimo_accesso&order=creato"),
      VADO.chiedi("accessi?select=id,utente,regione,pacchetto,concesso_il,scade_il,origine,nota")
    ]);
    /* I pareri si chiedono a parte e senza far fallire il resto: se questa
       richiesta va storta, la dashboard deve continuare a mostrare le persone
       e gli sblocchi, che sono la cosa per cui esiste. */
    try { PARERI = await VADO.daModerare(60); } catch (_) { PARERI = []; }
    /* Come i pareri: se questa richiesta va storta la dashboard deve
       continuare a mostrare le persone e gli sblocchi. */
    try {
      SEGN = await VADO.chiedi("segnalazioni?select=id,sid,regione,spiaggia,utente," +
        "genere,testo,creato,letta&order=creato.desc&limit=200");
    } catch (_) { SEGN = []; }
    try { IMPOST = await VADO.impostazioni(true); } catch (_) { IMPOST = { _righe: [] }; }
    /* Le immagini mandate senza parere: stessa cura dei pareri, se questa
       richiesta va storta il resto della dashboard deve restare in piedi. */
    try { FOTOLIB = await VADO.fotoDaModerare(200); } catch (_) { FOTOLIB = []; }
  }catch(e){
    return fuori("Non riesco a leggere", "Il servizio non risponde: " + e.message, false);
  }
  /* Un amministratore vede tutti i profili; un utente normale vede solo il
     proprio. Se ne torna uno solo ed e' il suo, non e' un errore: e' la
     risposta giusta a chi non ha i permessi. */
  if (PROFILI.length <= 1 && !(PROFILI[0] && PROFILI[0].ruolo === "admin"))
    return fuori("Questo account non amministra",
      "Sei entrato, ma il tuo account non ha i permessi di amministrazione: il database "+
      "ti mostra soltanto i tuoi dati.", false);
  disegna();
}

/* --------------------------------------------------------------- il registro
   Una riga per spiaggia, con dentro quello che c'e' e quello che manca. Non si
   carica da sola: cinquemilacinquecento righe sono un peso che si chiede solo
   quando serve, e quasi sempre serve una regione alla volta.

   Quello che si scrive qui finisce in due posti diversi, e la differenza conta:
   le note, lo stato e lo sponsor stanno nel taccuino — tabella a parte, la vede
   solo chi amministra — mentre i collegamenti di affiliazione e il comune per
   le notizie stanno sulla spiaggia, perche' domani la scheda deve stamparli. */
let REGISTRO = null, REG_FILTRO = "", REG_CERCA = "", REG_CARICO = false;

async function caricaRegistro(bottone){
  if (REG_CARICO) return;

  try {
    REGISTRO = await VADO.registro(REG_FILTRO, REG_CERCA, 6000, 0);
  } catch (e) {
    bottone.disabled = false; bottone.textContent = era; REG_CARICO = false;
    return alert("Non ha funzionato: " + e.message.slice(0, 200));

/* L'esportazione non chiede niente al database: mette su un file quello che e'
   gia' in pagina. Il punto e virgola e il BOM davanti sono per Excel italiano,
   che con la virgola mette tutto in una colonna sola e senza BOM storpia gli
   accenti. */
function esportaRegistro(){
  if (!REGISTRO || !REGISTRO.length) return;
  const col = [
    ["sid","Codice"],["regione","Regione"],["zona","Zona"],["nome","Nome"],["comune","Comune"],
    ["lat","Latitudine"],["lon","Longitudine"],["lato","Esposizione"],["lung","Lunghezza"],
    ["fondo","Fondo"],["folla","Affollamento"],["acc","Accesso"],["camm","Come si arriva"],
    ["park","Parcheggio"],["bandiera","Bandiera Blu"],["servizi","Servizi rilevati"],
    ["etichette","Etichette"],["nota","Descrizione"],["place_id","Google Place ID"],
    ["img","File immagine"],["img_fonte","Fonte immagine"],["notizie_com","Comune notizie"],
    ["aff_ristorante","Aff. ristorante"],["aff_albergo","Aff. albergo"],
    ["aff_ombrellone","Aff. ombrellone"],["aff_attivita","Aff. attività"],
    ["stato","Stato"],["priorita","Priorità"],["note_admin","Note"],
    ["sponsor","Sponsor"],["sponsor_fino","Sponsor fino al"]
  ];
  const cella = v => {
    if (v == null) return "";
    if (Array.isArray(v)) v = v.join(", ");
    if (v === true) return "sì";
    if (v === false) return "no";
    const t = String(v);
    return /[";\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  };
  const righe = [col.map(c => c[1]).join(";")]
    .concat(REGISTRO.map(r => col.map(c => cella(r[c[0]])).join(";")));
  const blob = new Blob(["\ufeff" + righe.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "registro-spiagge" + (REG_FILTRO ? "-" + REG_FILTRO : "") + ".csv";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ----------------------------------------------------------- il foglio Excel
   Lo stesso registro, ma come cartella di Excel: un foglio con una riga per
   spiaggia, uno di riepilogo con le formule vere — non i totali calcolati qui,
   cosi' si ricontano da soli se qualcuno filtra o corregge — e una legenda.

   La libreria che scrive il formato .xlsx si carica SOLO quando premi il
   pulsante: e' un file di trecento kilobyte che non ha senso far scaricare a
   chi apre la gestione per leggere una segnalazione. Se non arriva, si ripiega
   sul CSV senza dire niente di piu' di quel che serve. */
const SHEETJS = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
function portaLibreria(){
  if (window.XLSX) return Promise.resolve(true);
  return new Promise(ok => {
    const t = document.createElement("script");
    t.src = SHEETJS;
    t.onload  = () => ok(true);
    t.onerror = () => ok(false);
    document.head.appendChild(t);
  });
}

const COL_REG = [
  ["sid","Codice"],["regione","Regione"],["zona","Zona costiera"],["nome","Nome spiaggia"],
  ["comune","Comune"],["lat","Latitudine"],["lon","Longitudine"],["lato","Esposizione"],
  ["lung","Lunghezza"],["fondo","Fondo"],["folla","Affollamento 1-5"],["acc","Tipo di accesso"],
  ["camm","Come si arriva"],["park","Parcheggio"],["bandiera","Bandiera Blu"],
  ["servizi","Servizi rilevati"],["etichette","Etichette"],["nota","Descrizione"],
  ["place_id","Google Place ID"],["img","File immagine"],["img_fonte","Fonte immagine"],
  ["notizie_com","Comune per le notizie"],
  ["aff_ristorante","Affiliazione · dove mangiare"],["aff_albergo","Affiliazione · dove dormire"],
  ["aff_ombrellone","Affiliazione · ombrellone"],["aff_attivita","Affiliazione · attività"],
  ["stato","Stato lavorazione"],["priorita","Priorità 1-5"],["note_admin","Note interne"],
  ["sponsor","Sponsor locale"],["sponsor_fino","Sponsor pagato fino al"]
];
const semplice = v => Array.isArray(v) ? v.join(", ")
  : (v === true ? "sì" : (v === false ? "no" : (v == null ? "" : v)));

async function esportaExcel(bottone){
  if (!REGISTRO || !REGISTRO.length) return;
  const era = bottone.textContent;
  bottone.disabled = true; bottone.textContent = "Preparo…";
  if (!await portaLibreria()) {
    bottone.disabled = false; bottone.textContent = era;
    alert("Non riesco a caricare la libreria che scrive i file Excel.\n" +
          "Uso il CSV: si apre in Excel allo stesso modo.");
    return esportaRegistro();
  }
  const X = window.XLSX;
  const intestazioni = COL_REG.map(c => c[1]);
  const corpoFoglio = REGISTRO.map(r => COL_REG.map(c => semplice(r[c[0]])));
  const fSpiagge = X.utils.aoa_to_sheet([intestazioni].concat(corpoFoglio));
  fSpiagge["!autofilter"] = { ref: X.utils.encode_range(
    { s:{r:0,c:0}, e:{r:corpoFoglio.length, c:COL_REG.length - 1} }) };
  fSpiagge["!cols"] = COL_REG.map(c => ({
    wch: /Descrizione|Come si arriva|Parcheggio|Note interne|Affiliazione/.test(c[1]) ? 40
       : (/Nome|Zona|Comune/.test(c[1]) ? 24 : 14)
  }));

  /* Il riepilogo non porta numeri: porta formule. Se domani filtri il foglio
     Spiagge o correggi una riga, i conti si rifanno da soli — che e' tutta la
     differenza fra un foglio e una fotografia di un foglio. */
  const ultima = corpoFoglio.length + 1;
  const rg = n => "Spiagge!$" + n + "$2:$" + n + "$" + ultima;
  const regioniViste = [];
  REGISTRO.forEach(r => { if (!regioniViste.includes(r.regione)) regioniViste.push(r.regione); });
  const nomeReg = {};
  REGIONI.forEach(r => nomeReg[r.chiave] = r.nome);

  const rip = [["Regione","Chiave","Spiagge","Bandiere Blu","Senza descrizione",
                "Senza fondo","Senza come si arriva","Con sponsor","Da fare"]];
  regioniViste.forEach((k, i) => {
    const n = i + 2;
    rip.push([
      nomeReg[k] || k, k,
      { f: 'COUNTIF(' + rg("B") + ',$B' + n + ')' },
      { f: 'COUNTIFS(' + rg("B") + ',$B' + n + ',' + rg("O") + ',"sì")' },
      { f: 'COUNTIFS(' + rg("B") + ',$B' + n + ',' + rg("R") + ',"")' },
      { f: 'COUNTIFS(' + rg("B") + ',$B' + n + ',' + rg("J") + ',"")' },
      { f: 'COUNTIFS(' + rg("B") + ',$B' + n + ',' + rg("M") + ',"")' },
      { f: 'COUNTIFS(' + rg("B") + ',$B' + n + ',' + rg("AD") + ',"<>")' },
      { f: 'COUNTIFS(' + rg("B") + ',$B' + n + ',' + rg("AA") + ',"da fare")' }
    ]);
  });
  /* L'ultima riga con dei dati, non quella del totale: sommare fino a se'
     stessi e' un riferimento circolare, e Excel lo dice con un errore. */
  const tot = regioniViste.length + 1;
  rip.push(["TOTALE", "", { f: 'SUM(C2:C' + tot + ')' }, { f: 'SUM(D2:D' + tot + ')' },
    { f: 'SUM(E2:E' + tot + ')' }, { f: 'SUM(F2:F' + tot + ')' }, { f: 'SUM(G2:G' + tot + ')' },
    { f: 'SUM(H2:H' + tot + ')' }, { f: 'SUM(I2:I' + tot + ')' }]);
  const fRip = X.utils.aoa_to_sheet(rip);
  fRip["!cols"] = [{wch:28},{wch:18},{wch:10},{wch:14},{wch:18},{wch:13},{wch:20},{wch:13},{wch:10}];

  const oggi = new Date().toLocaleDateString("it-IT");
  const fLeg = X.utils.aoa_to_sheet([
    ["Registro delle spiagge · Vado in spiaggia"],
    ["Generato dalla pagina di gestione il " + oggi + "."],
    [""],
    ["Che cos’è", "Una riga per spiaggia, letta dal database nel momento in cui hai premuto Esporta."],
    ["", "Non è la copia di lavoro: se correggi una cella qui, il sito non se ne accorge."],
    ["", "Per cambiare qualcosa si usa la scheda «Registro spiagge» della gestione."],
    [""],
    ["Riepilogo", "Le colonne portano formule, non numeri: filtra o correggi il foglio Spiagge"],
    ["", "e i conti si rifanno da soli."],
    [""],
    ["Colonne da compilare", "Comune per le notizie, le quattro Affiliazioni, Stato, Priorità,"],
    ["", "Note interne, Sponsor. Oggi sono quasi tutte vuote: esistono perché"],
    ["", "il giorno che si accendono non si debba rifare niente."],
    [""],
    ["Note interne e Sponsor", "Stanno in una tabella che vede solo chi amministra."],
    ["", "Non escono mai dal sito, e non finiscono in nessuna scheda pubblica."],
    [""],
    ["Meteo e mare", "Non sono colonne e non possono esserlo: la scheda li chiede a Open-Meteo"],
    ["", "nel momento in cui la apri. Un meteo scritto in un foglio è già vecchio."],
    [""],
    ["Spiagge non pubblicate", "Qui ci sono solo quelle pubblicate. Le schede tenute da parte"],
    ["", "non stanno nel database, e restano nel vecchio spiagge-master.xlsx."],
    [""],
    ["Bandiera Blu", "Sì quando il premio ufficiale è stato abbinato a questa scheda."],
    ["", "Gli elenchi ufficiali ne premiano di più: non tutte le spiagge premiate"],
    ["", "sono pubblicate qui."]
  ]);
  fLeg["!cols"] = [{wch:24},{wch:86}];

  const libro = X.utils.book_new();
  X.utils.book_append_sheet(libro, fRip, "Riepilogo");
  X.utils.book_append_sheet(libro, fSpiagge, "Spiagge");
  X.utils.book_append_sheet(libro, fLeg, "Legenda");
  X.writeFile(libro, "registro-spiagge" + (REG_FILTRO ? "-" + REG_FILTRO : "") + ".xlsx");
  bottone.disabled = false; bottone.textContent = era;
}

/* --------------------------------------------------- la finestra di modifica */
const veloReg = document.getElementById("veloReg");
let regAperta = null;
const campoReg = id => document.getElementById(id);

function apriRegistro(sid){
  const r = (REGISTRO || []).find(x => x.sid === sid);
  if (!r) return;
  regAperta = r;
  campoReg("regChi").innerHTML = '<b>' + esc(r.nome) + '</b><br>' +
    esc(r.comune || "") + ' · ' + esc(r.sid);
  campoReg("regStato").value = r.stato || "";
  campoReg("regPrio").value  = r.priorita || "";
  campoReg("regNote").value  = r.note_admin || "";
  campoReg("regSpon").value  = r.sponsor || "";
  campoReg("regFino").value  = r.sponsor_fino || "";
  campoReg("regCom").value   = r.notizie_com || "";
  campoReg("regRist").value  = r.aff_ristorante || "";
  campoReg("regAlb").value   = r.aff_albergo || "";
  campoReg("regOmb").value   = r.aff_ombrellone || "";
  campoReg("regAtt").value   = r.aff_attivita || "";
  const es = campoReg("regEsito"); es.hidden = true;
  veloReg.showModal();
}

async function salvaRegistro(bottone){
  if (!regAperta) return;
  const es = campoReg("regEsito");
  const era = bottone.textContent; bottone.disabled = true; bottone.textContent = "Un momento…";
  const vuoto = v => (v || "").trim() || null;
  const lavoro = {
    stato: vuoto(campoReg("regStato").value),
    priorita: campoReg("regPrio").value ? +campoReg("regPrio").value : null,
    note: vuoto(campoReg("regNote").value),
    sponsor: vuoto(campoReg("regSpon").value),
    sponsor_fino: vuoto(campoReg("regFino").value)
  };
  const scheda = {
    notizie_com:    vuoto(campoReg("regCom").value),
    aff_ristorante: vuoto(campoReg("regRist").value),
    aff_albergo:    vuoto(campoReg("regAlb").value),
    aff_ombrellone: vuoto(campoReg("regOmb").value),
    aff_attivita:   vuoto(campoReg("regAtt").value)
  };
  try {
    await VADO.segnaLavoro(regAperta.sid, lavoro);
    await VADO.correggiSpiaggia(regAperta.sid, scheda);
  } catch (e) {
    es.textContent = "Non ha funzionato: " + e.message.slice(0, 200);
    es.className = "conto-esito brutta"; es.hidden = false;
    bottone.disabled = false; bottone.textContent = era; return;
  }
  /* La riga in pagina si aggiorna qui invece di rileggere tutto: rileggere
     seimila righe per una nota cambiata sarebbe sproporzionato. */
  Object.assign(regAperta, {
    stato: lavoro.stato, priorita: lavoro.priorita, note_admin: lavoro.note,
    sponsor: lavoro.sponsor, sponsor_fino: lavoro.sponsor_fino
  }, scheda);
  bottone.disabled = false; bottone.textContent = era;
  veloReg.close();
  disegna();
}
document.getElementById("regVai").onclick = e => salvaRegistro(e.currentTarget);

/* ------------------------------------------------------------- le schede
   Una pagina sola con sei sezioni in fila voleva dire scorrere fino in fondo
   per sapere se c'era una foto da approvare. Adesso sono schede, e il nome
   della scheda aperta finisce nell'indirizzo: ricaricando si torna dov'eri, e
   un collegamento a «#segnalazioni» porta dritto li'. */
const SCHEDE = [
  ["persone",      "Le persone"],
  ["regioni",      "Diffusione regioni"],
  ["contenuti",    "Contenuti"],
  ["registro",     "Registro spiagge"],
  ["segnalazioni", "Segnalazioni"],
  ["immagini",     "Immagini da approvare"],
  ["pareri",       "Pareri"],
  ["azienda",      "Dati dell’azienda"]
];
function schedaAperta(){
  const h = decodeURIComponent((location.hash || "").replace(/^#/, ""));
  return SCHEDE.some(x => x[0] === h) ? h : "persone";
}
/* I due conti che vanno visti prima di aprire: quante segnalazioni non ho
   ancora letto, e quante foto aspettano un si' o un no. Gli altri numeri
   possono aspettare di essere cercati; questi no. */
function contoScheda(chiave){
  if (chiave === "segnalazioni") return SEGN.filter(x => !x.letta).length;
  if (chiave === "immagini")     return PARERI.filter(r => r.foto && !r.foto_ok).length +
                                        FOTOLIB.filter(f => !f.ok).length;
  if (chiave === "azienda") {
    const righe = (IMPOST && IMPOST._righe) || [];
    return righe.filter(r => !(r.valore || "").trim()).length;
  }
  return 0;
}
function barraSchede(ora){
  return '<div class="gest-schede" role="tablist">' + SCHEDE.map(([k, et]) => {
    const n = contoScheda(k);
    return '<button type="button" role="tab" data-scheda="' + k + '"' +
      (k === ora ? ' class="on" aria-selected="true"' : ' aria-selected="false"') + '>' +
      esc(et) +
      (n ? '<span class="gest-conta' + (k === "azienda" ? ' calma' : '') + '">' + n + '</span>' : '') +
      '</button>';
  }).join("") + '</div>';
}

function disegna(){
  const perUtente = {};
  ACCESSI.forEach(a => (perUtente[a.utente] = perUtente[a.utente] || []).push(a));
  const vivi = ACCESSI.filter(a => !scaduto(a));
  const conQualcosa = new Set(vivi.map(a => a.utente));

  /* quante persone hanno ciascuna regione: uno sblocco di paese vale per tutte
     le sue regioni, quindi si contano insieme — altrimenti i pacchetti
     sembrerebbero non vendere mai */
  const domanda = {};
  REGIONI.forEach(r => domanda[r.chiave] = new Set());
  vivi.forEach(a => {
    if (a.regione && domanda[a.regione]) domanda[a.regione].add(a.utente);
    else if (a.pacchetto) {
      const p = PACCHETTI.find(x => x.chiave === a.pacchetto);
      if (p) REGIONI.filter(r => r.paese === p.paese).forEach(r => domanda[r.chiave].add(a.utente));
    }
  });
  const max = Math.max(1, ...Object.values(domanda).map(s => s.size));

  const ora = schedaAperta();
  let dentro = "";

  if (ora === "persone") {
    dentro =
      '<div class="gest-cifre">' +
        cifra(PROFILI.length, PROFILI.length === 1 ? "iscritto" : "iscritti") +
        cifra(conQualcosa.size, "con almeno uno sblocco") +
        cifra(vivi.length, vivi.length === 1 ? "sblocco attivo" : "sblocchi attivi") +
        cifra(ACCESSI.length - vivi.length, "scaduti") +
      '</div>' + noteLibere() + tabellaPersone(perUtente);

  } else if (ora === "regioni") {
    dentro = '<p class="gest-intro">Quante persone hanno ciascuna regione. Uno sblocco ' +
      'di paese intero vale per tutte le sue regioni, e viene contato in ognuna: ' +
      'altrimenti i <b>pacchetti sembrerebbero non vendere mai</b>.</p>' +
      tabellaRegioni(domanda, max);

  } else if (ora === "contenuti") {
    dentro = '<p class="gest-intro">Quanto è piena ogni regione: descrizioni, servizi, ' +
      'fondo, modo d’accesso, Bandiere Blu. È il contrario della scheda qui accanto — ' +
      'lì c’è <b>quanto vende</b> una regione, qui <b>quanto vale</b>.</p>' +
      '<div id="statoQui">' + bloccoStato() + '</div>';

  } else if (ora === "registro") {
    dentro = '<p class="gest-intro">Una riga per spiaggia, con quello che c’è e quello ' +
      'che manca. <b>Note, stato e sponsor restano fra noi</b> — stanno in una tabella ' +
      'che vede solo chi amministra; i quattro collegamenti e il comune delle notizie ' +
      'invece finiranno nella scheda, quando li accenderemo.</p>' +
      barraRegistro() + tabellaRegistro();

  } else if (ora === "segnalazioni") {
    dentro = '<p class="gest-intro">Gli errori che segnalano le persone, dal pulsante in ' +
      'fondo a ogni scheda. Segnarne una come letta non la cancella: <b>resta qui</b>, ' +
      'più pallida, finché non la butti tu.</p>' + elencoSegnalazioni();

  } else if (ora === "immagini") {
    dentro = '<p class="gest-intro">Tutte le immagini che arrivano dal sito: quelle ' +
      'allegate a un parere e quelle <b>mandate da sole</b>, senza scrivere niente. ' +
      'Finché stanno in attesa non le vede nessuno tranne te e chi le ha mandate. ' +
      'Approvarle le mette nella scheda della spiaggia; rifiutarle le cancella dal ' +
      'deposito — non le nasconde, le cancella.</p>' +
      galleriaFoto();

  } else if (ora === "pareri") {
    dentro = '<p class="gest-intro">Gli ultimi sessanta pareri. Si cancellano <b>per ' +
      'intero</b>, voto e commento insieme: un voto senza il commento che lo spiegava ' +
      'è un numero senza motivo.</p>' + tabellaPareri();

  } else if (ora === "azienda") {
    dentro = '<p class="gest-intro">Scritti una volta sola qui, compaiono ' +
      'nell’informativa privacy, nei termini di servizio e nel piede di ogni pagina. ' +
      'I campi vuoti restano <b>gialli</b> nelle pagine legali: è il promemoria.</p>' +
      moduloImpostazioni();
  }

  corpo.innerHTML = barraSchede(ora) + dentro;

  corpo.querySelectorAll("[data-scheda]").forEach(b =>
    b.onclick = () => { location.hash = b.dataset.scheda; });
  corpo.querySelectorAll("[data-vai-foto]").forEach(b =>
    b.onclick = () => { location.hash = "immagini"; });
  corpo.querySelectorAll("[data-reg-regione]").forEach(c =>
    c.onchange = () => { REG_FILTRO = c.value; });
  corpo.querySelectorAll("[data-reg-cerca]").forEach(c => {
    c.oninput = () => { REG_CERCA = c.value; };
    c.onkeydown = e => { if (e.key === "Enter") {
      e.preventDefault();
      const b = corpo.querySelector("[data-reg-carica]"); if (b) caricaRegistro(b);
    } };
  });
  corpo.querySelectorAll("[data-reg-carica]").forEach(b =>
    b.onclick = () => caricaRegistro(b));
  corpo.querySelectorAll("[data-reg-csv]").forEach(b =>
    b.onclick = () => esportaRegistro());
  corpo.querySelectorAll("[data-reg-xls]").forEach(b =>
    b.onclick = () => esportaExcel(b));
  corpo.querySelectorAll("[data-reg-apri]").forEach(b =>
    b.onclick = () => apriRegistro(b.dataset.regApri));

  corpo.querySelectorAll("[data-sblocca]").forEach(b =>
    b.onclick = () => apriSblocco(b.dataset.sblocca));
  corpo.querySelectorAll("[data-revoca]").forEach(b =>
    b.onclick = () => revoca(+b.dataset.revoca, b.dataset.che));
  corpo.querySelectorAll("[data-ruolo]").forEach(b =>
    b.onclick = () => cambiaRuolo(b.dataset.ruolo, b.dataset.a, b.dataset.chi));
  corpo.querySelectorAll("[data-segn-letta]").forEach(b =>
    b.onclick = () => segnaLetta(+b.dataset.segnLetta, b.dataset.come === "1"));
  corpo.querySelectorAll("[data-segn-via]").forEach(b =>
    b.onclick = () => buttaSegnalazione(+b.dataset.segnVia));
  corpo.querySelectorAll("[data-imp-salva]").forEach(b =>
    b.onclick = () => salvaImpostazioni(b));
  corpo.querySelectorAll("[data-stato]").forEach(b =>
    b.onclick = () => chiediStato(b));
  corpo.querySelectorAll("[data-imp-campo]").forEach(c =>
    c.addEventListener("input", () => {
      const b = corpo.querySelector("[data-imp-salva]");
      if (b) { b.disabled = false; b.textContent = "Salva i dati"; }
    }));
  corpo.querySelectorAll("[data-foto-si]").forEach(b =>
    b.onclick = () => approvaLaFoto(b.dataset.fotoSi, b.dataset.chi, b.dataset.perc, b));
  corpo.querySelectorAll("[data-foto-no]").forEach(b =>
    b.onclick = () => rifiutaLaFoto(b.dataset.fotoNo, b.dataset.chi, b.dataset.perc, b));
  corpo.querySelectorAll("[data-fl-si]").forEach(b =>
    b.onclick = () => approvaLibera(+b.dataset.flSi, b.dataset.flPerc, b));
  corpo.querySelectorAll("[data-fl-no]").forEach(b =>
    b.onclick = () => rifiutaLibera(+b.dataset.flNo, b.dataset.flPerc, b));
  appendiFotoGestione();
  corpo.querySelectorAll("[data-par]").forEach(b =>
    b.onclick = () => togliParere(b.dataset.par, b.dataset.chi, b));
}

/* ------------------------------------------------------- moderare i pareri
   Si cancella, non si nasconde: un parere nascosto resta nel database e prima
   o poi qualcuno se lo ritrova davanti senza sapere perche' era li'. E si
   cancella per intero — voto e commento insieme — perche' un voto senza il
   commento che lo spiegava e' un numero senza motivo. */
/* ------------------------------------------------------ le foto da approvare
   Il parere e' gia' pubblico, la foto no: finche' sta in «attesa/» non la vede
   nessuno tranne qui. Approvarla la sposta in «ok/», rifiutarla la cancella
   dal deposito — non la nasconde soltanto: una foto rifiutata non deve restare
   da nessuna parte. */
/* Il deposito e' chiuso: anche all'amministratore le immagini arrivano con un
   indirizzo firmato, chiesto dopo aver disegnato la tabella. */
function appendiFotoGestione(){
  corpo.querySelectorAll("img[data-gfoto]").forEach(async img => {
    try {
      const u = await VADO.firmaFoto(img.dataset.gfoto, 3600);
      if (u) img.src = u; else img.replaceWith(document.createTextNode("(immagine sparita)"));
    } catch (_) { img.alt = "non riesco a mostrarla"; }
  });
}

async function approvaLaFoto(sid, utente, percorso, bottone){
  bottone.disabled = true;
  try { await VADO.approvaFoto(sid, utente, percorso); }
  catch (e) { bottone.disabled = false; return alert("Non ha funzionato: " + e.message.slice(0,200)); }
  await carica();
}
async function rifiutaLaFoto(sid, utente, percorso, bottone){
  if (!confirm("Cancellare questa foto?\n\nSparisce dal deposito e non si recupera. Il parere resta.")) return;
  bottone.disabled = true;
  try { await VADO.rifiutaFoto(sid, utente, percorso); }
  catch (e) { bottone.disabled = false; return alert("Non ha funzionato: " + e.message.slice(0,200)); }
  await carica();
}

/* ------------------------------------------------- le immagini, in galleria
   Una foto non si giudica dentro la casella di una tabella: si guarda. Qui
   stanno tutte quelle allegate ai pareri, prima le in attesa — che sono il
   lavoro da fare — poi le gia' pubblicate, che restano a portata di mano per
   il giorno in cui una va tolta. */
function galleriaFoto(){
  /* Due strade, una griglia: le fotografie allegate a un parere e quelle
     mandate da sole. Chi modera non deve sapere da dove sono arrivate — deve
     vederle. L'unica differenza che conta e' in fondo alla scheda, dove c'e'
     scritto se insieme alla foto e' arrivato anche un giudizio. */
  const daPareri = PARERI.filter(r => r.foto).map(r => ({
    chiave: "p:" + r.sid + ":" + r.utente,
    percorso: r.foto, ok: !!r.foto_ok, spiaggia: r.spiaggia || r.sid,
    email: r.email, creata: r.creata, voto: r.voto, testo: r.commento,
    sid: r.sid, utente: r.utente, libera: false
  }));
  const libere = (FOTOLIB || []).map(f => ({
    chiave: "l:" + f.id,
    percorso: f.percorso, ok: !!f.ok, spiaggia: f.spiaggia || f.sid,
    email: f.email, creata: f.creata, voto: 0, testo: f.didascalia,
    id: f.id, libera: true
  }));
  const tutte = daPareri.concat(libere)
    .sort((a, b) => (a.ok ? 1 : 0) - (b.ok ? 1 : 0) ||
                    String(b.creata).localeCompare(String(a.creata)));
  if (!tutte.length)
    return '<div class="gest-vuoto">Nessuna immagine, né allegata a un parere né mandata da sola.</div>';

  return '<div class="gest-gall">' + tutte.map(f => {
    const dati = f.libera
      ? 'data-fl-si="' + f.id + '" data-fl-perc="' + esc(f.percorso) + '"'
      : 'data-foto-si="' + esc(f.sid) + '" data-chi="' + esc(f.utente) +
        '" data-perc="' + esc(f.percorso) + '"';
    const datiNo = f.libera
      ? 'data-fl-no="' + f.id + '" data-fl-perc="' + esc(f.percorso) + '"'
      : 'data-foto-no="' + esc(f.sid) + '" data-chi="' + esc(f.utente) +
        '" data-perc="' + esc(f.percorso) + '"';
    return '<div class="gest-scatto' + (f.ok ? '' : ' attesa') + '">' +
      '<img data-gfoto="' + esc(f.percorso) + '" alt="Immagine di ' + esc(f.spiaggia) + '">' +
      '<div class="bollo' + (f.ok ? ' viva' : '') + '">' +
        (f.ok ? 'pubblicata' : 'in attesa') +
        (f.libera ? ' · mandata da sola' : ' · con un parere') + '</div>' +
      '<div class="dove">' + esc(f.spiaggia) + '</div>' +
      '<div class="chi">' + esc(f.email || '—') + ' · ' + giorno(f.creata) +
        (f.voto ? ' · ' + "\u2605".repeat(f.voto) : '') + '</div>' +
      (f.testo ? '<div class="dice">' + esc(String(f.testo).slice(0, 140)) +
        (String(f.testo).length > 140 ? '…' : '') + '</div>' : '') +
      '<div class="mosse">' +
        (f.ok ? '' : '<button type="button" class="si" ' + dati + '>approva</button>') +
        '<button type="button" class="no" ' + datiNo + '>' +
          (f.ok ? 'togli dal sito' : 'rifiuta') + '</button>' +
      '</div></div>';
  }).join("") + '</div>';
}

/* Una regione "libera" la vede chiunque, anche chi non ha un account: non e'
   uno sblocco di nessuno, e infatti nella riga di una persona non compare.
   Senza dirlo, pero', sembra un difetto — uno toglie lo sblocco delle Marche e
   le Marche restano aperte. Si dice qui, dove si guarda. */
function noteLibere(){
  const l = REGIONI.filter(r => r.libera);
  if (!l.length) return "";
  return '<p class="gest-nota">' +
    (l.length === 1 ? '<b>' + esc(l[0].nome) + '</b> è libera per tutti'
                    : '<b>' + l.map(r => esc(r.nome)).join(", ") + '</b> sono libere per tutti') +
    ': si vede senza account e senza sblocco, quindi non compare qui fra gli sblocchi di nessuno. ' +
    'Per chiuderla si toglie il segno «libera» alla regione, non l\'accesso alla persona.</p>';
}
/* Il proprio ruolo non si tocca da qui. Chi si declassa per sbaglio non ha
   nessuno a cui chiedere di rimetterlo: dovrebbe entrare nella console di
   Supabase. Se davvero serve, lo fa un altro amministratore.
   Il database ha comunque la sua rete — un trigger rifiuta di lasciare il
   sito senza nessun amministratore — ma una porta che non si vede e' meglio
   di un errore che arriva dopo. */
function bottoneRuolo(p){
  const io = VADO.chiSono();
  if (io && p.utente === io.id) return '<span class="gest-ruolo">sei tu</span>';
  const admin = p.ruolo === "admin";
  return '<button type="button" class="gest-ruolo tocca" data-ruolo="' + p.utente +
    '" data-a="' + (admin ? "utente" : "admin") +
    '" data-chi="' + esc(p.email || p.nome || "questa persona") + '">' +
    (admin ? "togli i permessi" : "rendi amministratore") + '</button>';
}

/* ---------------------------------------------------- i dati dell'azienda
   Stavano scritti a mano dentro privacy.html. Da qui si cambiano una volta e
   cambiano ovunque: nell'informativa e nel piede di ogni pagina.
   I gruppi servono solo a leggerli in ordine — chi siamo, la privacy, il
   piede — perche' dodici campi in fila sono un modulo che nessuno finisce. */
const GRUPPI_IMP = {
  chi:     ["Chi sei", "Vanno nel piede di ogni pagina e in cima all’informativa."],
  privacy: ["Per l’informativa", "A chi scrive chi vuole i suoi dati, e chi sono i fornitori da nominare."],
  piede:   ["Il piede del sito", "Il copyright in fondo alle pagine."]
};
function moduloImpostazioni(){
  const righe = (IMPOST && IMPOST._righe) || [];
  if (!righe.length)
    return '<div class="gest-vuoto">Non riesco a leggere le impostazioni.</div>';
  let html = '<div class="gest-imp">';
  Object.keys(GRUPPI_IMP).forEach(g => {
    const sue = righe.filter(r => r.gruppo === g);
    if (!sue.length) return;
    html += '<div class="gest-imp-gruppo"><h4>' + esc(GRUPPI_IMP[g][0]) + '</h4>' +
            '<p class="gest-imp-nota">' + esc(GRUPPI_IMP[g][1]) + '</p>';
    sue.forEach(r => {
      const vuoto = !(r.valore || "").trim();
      html += '<label class="gest-imp-campo' + (vuoto ? ' vuoto' : '') + '">' +
        '<span>' + esc(r.etichetta || r.chiave) + '</span>' +
        '<input type="text" data-imp-campo="' + esc(r.chiave) + '" value="' +
          esc(r.valore || "") + '" placeholder="' + esc(r.aiuto || "") + '">' +
        (r.aiuto ? '<i>' + esc(r.aiuto) + '</i>' : '') + '</label>';
    });
    html += '</div>';
  });
  return html + '<div class="gest-imp-fondo">' +
    '<button type="button" data-imp-salva disabled>Salva i dati</button>' +
    '<span class="gest-imp-esito" data-imp-esito>' + esc(IMP_DETTO) + '</span></div></div>';
}
/* Si salvano solo quelli cambiati: mandare dodici scritture per correggere un
   CAP vuol dire dodici righe toccate nel registro del database, e dodici
   occasioni perche' una vada storta. */
async function salvaImpostazioni(bottone){
  const righe = (IMPOST && IMPOST._righe) || [];
  const esito = corpo.querySelector("[data-imp-esito]");
  const cambiati = [];
  corpo.querySelectorAll("[data-imp-campo]").forEach(c => {
    const vecchio = (righe.find(r => r.chiave === c.dataset.impCampo) || {}).valore || "";
    if (c.value.trim() !== vecchio.trim()) cambiati.push([c.dataset.impCampo, c.value.trim()]);
  });
  if (!cambiati.length) { esito.textContent = "Non è cambiato niente."; return; }
  bottone.disabled = true; bottone.textContent = "Un momento…";
  try {
    for (const [k, v] of cambiati) await VADO.salvaImpostazione(k, v);
    IMP_DETTO = cambiati.length === 1 ? "Salvato." : "Salvati " + cambiati.length + " campi.";
    await carica();          /* ridisegna: il messaggio se lo porta IMP_DETTO */
    IMP_DETTO = "";
  } catch (e) {
    bottone.disabled = false; bottone.textContent = "Salva i dati";
    esito.textContent = "Non ha funzionato: " + e.message.slice(0, 160);
  }
}

/* ------------------------------------------------------- le segnalazioni
   Arrivano dalle schede delle spiagge. Si leggono, si segnano come lette, e
   quando sono servite si buttano: tenerle per sempre vuol dire ritrovarsi fra
   un anno con una lista che nessuno guarda piu'. */
const GENERI_SEGN = {
  posizione: "posizione", dati: "dati", servizi: "servizi",
  immagine: "immagine",  altro: "altro"
};
/* Se il profilo non si trova non si inventa niente: si mostra solo la data.
   Scrivere "un iscritto che non c'e' piu'" sarebbe una deduzione, e per giunta
   quasi sempre sbagliata. */
function chiScrisse(u){
  const p = PROFILI.find(x => x.utente === u);
  return p ? (p.email || p.nome || "") : "";
}
function elencoSegnalazioni(){
  if (!SEGN.length)
    return '<div class="gest-vuoto">Nessuna segnalazione. Il pulsante sta in fondo a ogni scheda.</div>';
  return '<div class="gest-segn">' + SEGN.map(s => {
    const pag = s.regione ? 'spiagge-' + s.regione + '.html#' + encodeURIComponent(s.sid) : null;
    return '<div class="gest-segn-riga' + (s.letta ? ' letta' : '') + '">' +
      '<div class="gest-segn-capo">' +
        '<b>' + esc(s.spiaggia || s.sid) + '</b>' +
        '<span class="gest-segn-genere">' + esc(GENERI_SEGN[s.genere] || s.genere) + '</span>' +
        '<span class="gest-quando">' + giorno(s.creato) +
          (chiScrisse(s.utente) ? ' · ' + esc(chiScrisse(s.utente)) : '') + '</span>' +
      '</div>' +
      '<p class="gest-segn-testo">' + esc(s.testo) + '</p>' +
      '<div class="gest-segn-pie">' +
        (pag ? '<a href="' + pag + '" target="_blank" rel="noopener">apri la scheda ↗</a>' : '') +
        '<button type="button" data-segn-letta="' + s.id + '" data-come="' + (s.letta ? '0' : '1') + '">' +
          (s.letta ? 'segna da rivedere' : 'segna come letta') + '</button>' +
        '<button type="button" data-segn-via="' + s.id + '">cancella</button>' +
      '</div></div>';
  }).join("") + '</div>';
}
async function segnaLetta(id, come){
  try{
    await VADO.chiedi("segnalazioni?id=eq." + id, { metodo:"PATCH", corpo:{ letta: come },
      intestazioni:{ "Prefer":"return=minimal" } });
    const s = SEGN.find(x => x.id === id); if (s) s.letta = come;
    disegna();
  }catch(e){ alert("Non ha funzionato: " + e.message.slice(0,200)); }
}
async function buttaSegnalazione(id){
  const s = SEGN.find(x => x.id === id);
  if (!confirm("Cancellare la segnalazione su «" + ((s && (s.spiaggia || s.sid)) || "questa spiaggia") + "»?\n\nNon si recupera.")) return;
  try{
    await VADO.chiedi("segnalazioni?id=eq." + id, { metodo:"DELETE",
      intestazioni:{ "Prefer":"return=minimal" } });
    SEGN = SEGN.filter(x => x.id !== id);
    disegna();
  }catch(e){ alert("Non ha funzionato: " + e.message.slice(0,200)); }
}

function tabellaRegioni(domanda, max){
  const righe = REGIONI.slice().sort((a,b) =>
    domanda[b.chiave].size - domanda[a.chiave].size || a.ordine - b.ordine);
  return '<table class="gest-tab"><thead><tr><th>Regione</th>' +
    '<th class="gest-nascondi">Spiagge</th><th>Persone</th><th style="width:34%"></th></tr></thead><tbody>' +
    righe.map(r => '<tr>' +
      '<td>' + esc(r.nome) + (r.libera ? ' <span class="gest-ruolo">libera</span>' : '') + '</td>' +
      '<td class="gest-nascondi gest-quando">' + r.spiagge + '</td>' +
      '<td class="gest-quando">' + domanda[r.chiave].size + '</td>' +
      '<td><div class="gest-barra"><i style="width:' +
        (100 * domanda[r.chiave].size / max).toFixed(1) + '%"></i></div></td></tr>').join("") +
    '</tbody></table>';
}

/* -------------------------------------------------- lo stato dei contenuti
   Quanto e' piena ogni regione. Il conto lo fa il database (rpc/stato_regioni):
   cinquemilacinquecento schede non si scaricano nel browser per contarle, e la
   RLS non le farebbe nemmeno uscire tutte.

   Due colonne pero' nel database non ci sono, e stanno qui sotto scritte a
   mano: da quale fonte viene la veduta dall'alto di quella regione, e quanto
   e' fitta la linea di costa disegnata nella sua pagina. Sono due fatti che
   cambiano quando si rifa' un archivio o si ridisegna una carta — cioe' quasi
   mai — e metterli in una tabella del database vorrebbe dire mantenerli in due
   posti invece che in uno. */

  centro:"dgt", cicladi:"grec", corsica:"ign", creta:"grec", dalmaziacentro:"dgu",
  dalmazianord:"dgu", dalmaziasud:"dgu", egeonord:"grec", emiliaromagna:"rer", epiro:"grec",
  eubea:"grec", friuliveneziagiulia:"agea", gozo:"malt", greciaovest:"grec", ionie:"grec",
  istria:"dgu", lazio:"agea", liguria:"agea", lisboa:"dgt", litorale:"gurs", madeira:"ptis",

  hr:"Croazia", si:"Slovenia", gr:"Grecia", mt:"Malta", me:"Montenegro",
  al:"Albania", ba:"Bosnia-Erzegovina" };
const BB_ANNO = { it:"2026", fr:"2026", es:"2026", pt:"2026", gr:"2026",
  hr:"senza anno", si:"2026 da conf.", mt:"2025", me:"—", al:"—", ba:"—" };

let STATO = null;            /* null = non ancora chiesto */

/* «56 su 58» con la barretta sotto. Sopra il 97% e' pieno, sotto i tre quarti
   e' a meta': le soglie servono al colore, il numero resta quello vero. */
function cellaCop(n, tot, piu){
  const extra = piu ? " " + piu : "";
  if (!tot) return '<td class="gest-cop zero' + extra + '"><b>—</b></td>';
  const p = n / tot;
  const cl = n === tot ? "pieno" : (p >= .75 ? "quasi" : (n ? "meta" : "zero"));
  const testo = n === tot ? "<b>tutte</b>"
              : (n === 0 ? "<b>nessuna</b>" : '<b>' + n + '</b><span>/' + tot + '</span>');
  return '<td class="gest-cop ' + cl + extra + '">' + testo +
         '<i><u style="width:' + (p * 100).toFixed(1) + '%"></u></i></td>';
}

function tabellaStato(){
  if (!STATO || !STATO.length)
    return '<div class="gest-vuoto">Il database non ha restituito niente.</div>';
  const ordine = ["it","fr","es","pt","hr","si","gr","mt","me","al","ba"];
  let html = '<div class="gest-scorri"><table class="gest-tab"><thead><tr>' +
    '<th>Regione</th><th class="gest-nascondi">Veduta dall’alto</th>' +
    '<th>Descri&shy;zione</th><th>Servizi</th>' +
    '<th class="gest-nascondi">Fondo</th><th>Come si arriva</th>' +
    '<th>Bandiere Blu</th><th class="gest-nascondi">Costa</th>' +
    '</tr></thead><tbody>';
  ordine.forEach(p => {
    const sue = STATO.filter(r => r.paese === p).sort((a,b) => b.spiagge - a.spiagge);
    if (!sue.length) return;
    const tot = sue.reduce((s,r) => s + r.spiagge, 0);
    const alta = sue.reduce((s,r) =>
      s + ((SORGENTI[FOTO[r.chiave]] || [,,""])[2] !== "bassa" ? r.spiagge : 0), 0);
    html += '<tr class="gest-paese"><td colspan="8">' + esc(PAESI_NOME[p] || p) +
      '<b>' + sue.length + (sue.length === 1 ? " regione" : " regioni") + ' · ' + tot +
      ' spiagge · veduta ad alta risoluzione per ' + alta + '</b></td></tr>';
    sue.forEach(r => {
      const f = SORGENTI[FOTO[r.chiave]] || ["?", "non so", "bassa"];
      const m = COSTA[r.chiave];
      const cc = m == null ? "zero" : (m <= 300 ? "pieno" : (m <= 600 ? "quasi"
                : (m <= 1000 ? "meta" : "zero")));
      html += '<tr>' +
        '<td class="gest-chi">' + esc(r.nome) +
          '<div class="gest-quando">' + r.spiagge + ' spiagge · ' + r.zone + ' zone</div></td>' +
        '<td class="gest-nascondi gest-vista ' + f[2] + '"><b>' + esc(f[0]) + '</b>' +
          '<span>' + esc(f[1]) + '</span></td>' +
        cellaCop(r.descrizione, r.spiagge) +
        cellaCop(r.servizi, r.spiagge) +
        cellaCop(r.fondo, r.spiagge, "gest-nascondi") +
        cellaCop(r.accesso, r.spiagge) +
        '<td class="gest-cop ' + (r.bandiere ? "pieno" : "zero") + '"><b>' + r.bandiere +
          '</b><span style="display:block">' + esc(BB_ANNO[r.paese] || "") + '</span></td>' +
        '<td class="gest-nascondi gest-cop ' + cc + '"><b>' +
          (m == null ? "—" : m + " m") + '</b></td>' +
        '</tr>';
    });
  });
  return html + '</tbody></table></div>';
}

function bloccoStato(){
  if (STATO) return tabellaStato();
  return '<div class="gest-stato-via">' +
    '<p>Quante delle 5534 schede hanno davvero la descrizione, i servizi, il fondo e ' +
    'il modo d’accesso, regione per regione. <b>Il conto lo fa il database</b>, e ci ' +
    'mette un paio di secondi: si chiede solo quando serve.</p>' +
    '<button type="button" class="conto-vai" data-stato style="flex:0 0 auto">' +
    'Calcola lo stato</button></div>';
}

async function chiediStato(bottone){
  bottone.disabled = true;
  const era = bottone.textContent;
  bottone.textContent = "Conto…";
  try {
    STATO = await VADO.statoRegioni();
  } catch (e) {
    bottone.disabled = false; bottone.textContent = era;
    const p = bottone.parentNode.querySelector("p");
    if (p) p.innerHTML = '<b>Non ha funzionato:</b> ' + esc(e.message);
    return;
  }
  const posto = document.getElementById("statoQui");
  if (posto) posto.innerHTML = tabellaStato();
}

/* ------------------------------------------------------------- concedere */
let sblUtente = null;
function apriSblocco(utente){
  sblUtente = utente;
  const p = PROFILI.find(x => x.utente === utente);
  document.getElementById("sblChi").textContent = "A " + (p ? (p.email || p.nome) : "questa persona");
  const gia = new Set(ACCESSI.filter(a => a.utente === utente)
    .map(a => a.regione ? "r:" + a.regione : "p:" + a.pacchetto));
  /* Quel che ha gia' non si ripropone: sarebbe l'unica scelta che non funziona,
     e scoprirlo solo dopo aver premuto e' una piccola presa in giro. */
  document.getElementById("sblCosa").innerHTML =
    '<optgroup label="Paesi interi">' +
      PACCHETTI.filter(p => !gia.has("p:" + p.chiave))
        .map(p => '<option value="p:' + p.chiave + '">' + esc(p.nome) + '</option>').join("") +
    '</optgroup><optgroup label="Regioni">' +
      REGIONI.filter(r => !r.libera && !gia.has("r:" + r.chiave))
        .map(r => '<option value="r:' + r.chiave + '">' + esc(r.nome) + '</option>').join("") +
    '</optgroup>';
  document.getElementById("sblScade").value = "";
  document.getElementById("sblNota").value = "";
  const e = document.getElementById("sblEsito"); e.hidden = true;
  veloSbl.showModal();
}

document.getElementById("sblVai").onclick = async function(){
  const scelta = document.getElementById("sblCosa").value;
  const e = document.getElementById("sblEsito");
  if (!scelta) { e.textContent = "Non c'è niente da sbloccare: ha già tutto.";
                 e.className = "conto-esito brutta"; e.hidden = false; return; }
  const scade = document.getElementById("sblScade").value;
  const riga = { utente: sblUtente, origine: "manuale",
                 nota: document.getElementById("sblNota").value.trim() || null,
                 scade_il: scade ? new Date(scade + "T23:59:59").toISOString() : null };
  if (scelta.startsWith("p:")) riga.pacchetto = scelta.slice(2); else riga.regione = scelta.slice(2);
  this.disabled = true; const era = this.textContent; this.textContent = "Un momento…";
  try{
    await VADO.chiedi("accessi", { metodo:"POST", corpo: riga,
      intestazioni:{ "Prefer":"return=minimal" } });
    veloSbl.close(); await carica();
  }catch(err){
    e.textContent = "Non ha funzionato: " + err.message.slice(0,160);
    e.className = "conto-esito brutta"; e.hidden = false;
  }
  this.disabled = false; this.textContent = era;
};

/* ----------------------------------------------------- nominare un admin
   Dare i permessi non e' come sbloccare una regione, e la domanda lo dice:
   chi accetta diventa pari a chi concede, e potra' togliere i permessi anche
   a chi glieli ha dati. Meglio leggerlo prima che scoprirlo dopo. */
async function cambiaRuolo(utente, a, chi){
  const avviso = a === "admin"
    ? "Rendere «" + chi + "» amministratore?\n\n" +
      "Potra' fare tutto quello che fai tu: vedere gli iscritti, sbloccare e " +
      "revocare le regioni a chiunque, cancellare i pareri, e nominare altri " +
      "amministratori — compreso togliere i permessi a te."
    : "Togliere i permessi di amministratore a «" + chi + "»?\n\n" +
      "Torna un utente normale. Le regioni che ha sbloccato restano sue.";
  if (!confirm(avviso)) return;
  try{
    await VADO.chiedi("profili?utente=eq." + utente, { metodo:"PATCH", corpo:{ ruolo:a },
      intestazioni:{ "Prefer":"return=minimal" } });
    await carica();
  }catch(e){
    /* Il messaggio del database e' scritto per essere letto: quando rifiuta
       di lasciare il sito senza amministratori lo dice in italiano. */
    alert(e.message.slice(0,300));
  }
}

async function revoca(id, che){
  if (!confirm("Togliere «" + che + "»?")) return;
  try{
    await VADO.chiedi("accessi?id=eq." + id, { metodo:"DELETE",
      intestazioni:{ "Prefer":"return=minimal" } });
    await carica();
  }catch(e){ alert("Non ha funzionato: " + e.message.slice(0,200)); }
}

/* Cambiare scheda non richiede niente al database: i dati sono gia' qui, si
   ridisegna e basta. Il guardiano e' PROFILI: se e' vuoto la pagina non ha
   ancora caricato — o chi guarda non amministra — e non c'e' niente da
   ridisegnare. */
window.addEventListener("hashchange", () => { if (PROFILI.length) disegna(); });

VADO.alCambio(s => { IO = s; carica(); });
